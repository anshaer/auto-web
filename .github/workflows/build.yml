name: Build portable Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VoxelCharacter-Windows-folder
          - os: macos-15
            artifact: VoxelCharacter-macOS-AppleSilicon
          - os: macos-15-intel
            artifact: VoxelCharacter-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - name: Verify Windows runtime remains unchanged
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $a = (Get-FileHash node_modules/electron/dist/electron.exe -Algorithm SHA256).Hash
          $b = (Get-FileHash dist/VoxelCharacter/electron.exe -Algorithm SHA256).Hash
          if ($a -ne $b) { throw 'Electron executable changed' }
      - name: Prepare macOS camera permission and local signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /usr/libexec/PlistBuddy -c 'Add :NSCameraUsageDescription string Face and head tracking uses your selected camera.' dist/VoxelCharacter/Electron.app/Contents/Info.plist || /usr/libexec/PlistBuddy -c 'Set :NSCameraUsageDescription Face and head tracking uses your selected camera.' dist/VoxelCharacter/Electron.app/Contents/Info.plist
          codesign --force --deep --sign - dist/VoxelCharacter/Electron.app
          codesign --verify --deep --strict dist/VoxelCharacter/Electron.app
          ditto -c -k --sequesterRsrc --keepParent dist/VoxelCharacter VoxelCharacter-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact }}
          path: dist/VoxelCharacter/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.artifact }}
          path: VoxelCharacter-macOS.zip
          if-no-files-found: error
